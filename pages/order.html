<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Страница для заказа товаров и услуг у компании PcMarket">
    <link rel="stylesheet" href="../css/output.css">
    <title>Оформление заказа</title>
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="site-header__link">
            <h1 class="site-header__name"><span class="site-header__accent">PC</span>Market</h1>
        </a>
        <nav class="site-nav">
            <ul class="site-nav__list">
                <li class="site-nav__item">
                    <a href="../index.html#advantages" class="site-nav__link">Преимущества</a>
                </li>
                <li class="site-nav__item">
                    <a href="catalog.html" class="site-nav__link">Каталог</a> 
                </li>
                <li class="site-nav__item">
                    <a href="order.html" class="site-nav__link">Заказ</a> 
                </li>
                <li class="site-nav__item">
                    <a href="aboutUs.html" class="site-nav__link">О нас</a>
                </li>
                <li class="site-nav__item">
                    <a href="reviews.html" class="site-nav__link">Отзывы</a>
                </li>
                <li class="site-nav__item">
                    <a href="contacts.html" class="site-nav__link">Контакты</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="mx-auto mt-10 mb-20 max-w-[600px]">
            <h1 class="mb-4 text-center text-[36px] font-bold">Оформление заказа</h1>
            <p class="mb-10 text-center text-text-muted">Заполните форму ниже, и наш менеджер свяжется с вами для подтверждения заказа.</p>
            
            <form class="flex flex-col gap-6 rounded-lg border border-border bg-bg-card p-10 shadow-card" action="#" method="POST">
                
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-text" for="order-product">Выбранный товар или услуга</label>
                    <select class="w-full rounded-md border border-border bg-transparent px-4 py-3.5 text-base font-[inherit] text-text transition-[border-color,box-shadow] duration-300 ease-[ease] focus:border-primary focus:shadow-card focus:outline-none" id="order-product" name="product" required>
                        <option value="" disabled selected>Выберите из списка...</option>
                        <option value="pc-ultra">Игровой ПК PcMarket Ultra</option>
                        <option value="rtx-4070">Видеокарта GeForce RTX 4070 Super</option>
                        <option value="custom-build">Индивидуальная сборка ПК</option>
                        <option value="other">Другой товар из каталога</option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-text" for="order-name">Ваше имя</label>
                    <input class="w-full rounded-md border border-border bg-transparent px-4 py-3.5 text-base font-[inherit] text-text transition-[border-color,box-shadow] duration-300 ease-[ease] focus:border-primary focus:shadow-card focus:outline-none" type="text" id="order-name" name="name" placeholder="Иван Иванов" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-text" for="order-phone">Контактный телефон</label>
                    <input class="w-full rounded-md border border-border bg-transparent px-4 py-3.5 text-base font-[inherit] text-text transition-[border-color,box-shadow] duration-300 ease-[ease] focus:border-primary focus:shadow-card focus:outline-none" type="tel" id="order-phone" name="phone" placeholder="+7 (999) 000-00-00" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-text" for="order-email">E-mail</label>
                    <input class="w-full rounded-md border border-border bg-transparent px-4 py-3.5 text-base font-[inherit] text-text transition-[border-color,box-shadow] duration-300 ease-[ease] focus:border-primary focus:shadow-card focus:outline-none" type="email" id="order-email" name="email" placeholder="example@mail.ru" required>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-bold text-text" for="order-comment">Комментарий к заказу</label>
                    <textarea class="min-h-[100px] w-full resize-y rounded-md border border-border bg-transparent px-4 py-3.5 text-base font-[inherit] text-text transition-[border-color,box-shadow] duration-300 ease-[ease] focus:border-primary focus:shadow-card focus:outline-none" id="order-comment" name="comment" rows="4" placeholder="Пожелания по доставке..."></textarea>
                </div>

                <div class="flex flex-row items-center gap-2">
                    <input class="size-[18px] cursor-pointer accent-primary" type="checkbox" id="order-consent" name="consent" required>
                    <label class="cursor-pointer text-sm font-normal text-text-muted" for="order-consent">
                        Я согласен на обработку персональных данных
                    </label>
                </div>

                <div class="mt-4">
                    <button class="button button-primary w-full p-4! text-lg!" type="submit">Оформить заказ</button>
                </div>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2026 PcMarket. Все права защищены.</p>
    </footer>

</body>
</html>
